\catcode`\#=12
\Configure{MathJaxConfig}{\detokenize{{
  loader: {
    load: ['[tex]/html', 'a11y/assistive-mml'],
    ready: function () {
      const Configuration = MathJax._.input.tex.Configuration.Configuration;
      const CommandMap = MathJax._.input.tex.TokenMap.CommandMap;
      const TEXCLASS = MathJax._.core.MmlTree.MmlNode.TEXCLASS;
      const sub = function (parser, tex) {
        parser.string = tex + parser.string.slice(parser.i);
        parser.i = 0;
      };
      const intent = function (concept, body) { return ('\\MathMLintent{' + concept + '}{' + body + '}'); };
      const arg = function (name, body) { return ('\\MathMLarg{' + name + '}{' + body + '}'); };
      const split = function (text) {
        const parts = [];
        let depth = 0;
        let piece = '';
        let escaped = false;
        Array.from(text).forEach(function (c) {
          if (escaped) { escaped = false; piece += c; }
          else if (c === '\\') { escaped = true; piece += c; }
          else if (c === ',' ? depth === 0 : false) { parts.push(piece.trim()); piece = ''; }
          else {
            if (c === '{') { depth += 1; }
            if (c === '}') { depth -= 1; }
            piece += c;
          }
        });
        parts.push(piece.trim());
        return (parts);
      };
      const list = function (prefix, text) {
        const items = split(text);
        return ({
          names: items.map(function (item, i) { return ('$' + prefix + (i + 1)); }).join(','),
          body: items.map(function (item, i) { return (arg(prefix + (i + 1), item)); }).join(',')
        });
      };
      const paren = function (parser) {
        if (parser.GetNext() !== '(') { return (null); }
        const s = parser.string;
        let depth = 0;
        let braces = 0;
        let j = parser.i;
        let end = -1;
        while (end === -1 ? j !== s.length : false) {
          const c = s.charAt(j);
          if (c === '\\') { j += 1; }
          else if (c === '{') { braces += 1; }
          else if (c === '}') { braces -= 1; }
          else if (braces === 0) {
            if (c === '(') { depth += 1; }
            if (c === ')') { depth -= 1; if (depth === 0) { end = j; } }
          }
          j += 1;
        }
        if (end === -1) { return (null); }
        const inner = s.slice(parser.i + 1, end);
        parser.i = end + 1;
        return (inner);
      };
      const apply = function (parser, concept, body) {
        const point = paren(parser);
        if (point === null) { return (intent(concept, body)); }
        const at = list('y', point);
        return (intent('$g(' + at.names + ')', arg('g', intent(concept, body)) + '(' + at.body + ')'));
      };
      const fenced = function (concept, left, right, letter) {
        return (function (parser, name) {
          const chosen = (concept === 'norm') ? parser.GetBrackets(name, concept).trim() : concept;
          const inner = parser.GetArgument(name);
          sub(parser, intent(chosen + '($' + letter + ')', '\\left' + left + arg(letter, inner) + '\\right' + right));
        });
      };
      const infix = function (concept, sign) {
        return (function (parser, name) {
          const a = parser.GetArgument(name);
          const b = parser.GetArgument(name);
          sub(parser, intent(concept + ':infix($a,$b)', arg('a', a) + sign + arg('b', b)));
        });
      };
      new CommandMap('xmintent', {
        MathMLintent: function (parser, name) {
          const intent = parser.GetArgument(name).trim();
          const math = parser.ParseArg(name);
          const row = parser.create('node', 'TeXAtom', [math]);
          row.attributes.set('intent', intent);
          parser.Push(row);
        },
        MathMLarg: function (parser, name) {
          const arg = parser.GetArgument(name).trim();
          let node = parser.ParseArg(name);
          if (node.isInferred) { node = parser.create('node', 'TeXAtom', [node]); }
          node.attributes.set('arg', arg);
          parser.Push(node);
        },
        xmunits: function (parser, name) {
          const intent = parser.GetBrackets(name, ':unit').trim();
          const typed = parser.GetArgument(name).split('\\textdegree').join(String.fromCharCode(176)).trim();
          const text = typed.split('.').join('').split('~').join(String.fromCharCode(160));
          const node = parser.create('token', 'mi', {mathvariant: 'normal', intent: intent}, text);
          node.texClass = TEXCLASS.ORD;
          parser.Push(node);
        },
        xmdeg: function (parser, name) { sub(parser, '\\xmunits{\\textdegree}'); },
        xmabs: fenced('absolute-value', '\\lvert', '\\rvert', 'x'),
        xmdet: fenced('determinant', '\\lvert', '\\rvert', 'x'),
        xmcard: fenced('cardinality', '\\lvert', '\\rvert', 's'),
        xmnorm: fenced('norm', '\\lVert', '\\rVert', 'v'),
        xmdot: infix('dot-product', '\\cdot'),
        xmcross: infix('cross-product', '\\times'),
        xmpoint: function (parser, name) {
          const coords = list('a', parser.GetArgument(name));
          sub(parser, intent('point(' + coords.names + ')', '\\left(' + coords.body + '\\right)'));
        },
        xminterval: function (parser, name) {
          const typed = parser.GetArgument(name).trim();
          const left = typed.charAt(0);
          const right = typed.charAt(typed.length - 1);
          const ends = split(typed.slice(1, -1));
          const l = (left === '[');
          const r = (right === ']');
          const concept = (l ? (r ? 'closed' : 'closed-open') : (r ? 'open-closed' : 'open')) + '-interval';
          sub(parser, intent(concept + '($a,$b)', '\\left' + left + arg('a', ends[0]) + ',' + arg('b', ends[1] || '') + '\\right' + right));
        },
        xmfn: function (parser, name) {
          const spoken = parser.GetArgument(name).trim();
          const symbol = parser.GetArgument(name);
          const inner = parser.GetBrackets(name);
          if (inner === undefined) { sub(parser, intent(':function', symbol)); }
          else {
            const concept = spoken ? spoken + '($x)' : '$f($x)';
            const head = spoken ? '{' + symbol + '}' : arg('f', symbol);
            sub(parser, apply(parser, concept, head + '[' + arg('x', inner) + ']'));
          }
        },
        xmfunction: function (parser, name) {
          const symbol = parser.GetArgument(name);
          const point = paren(parser);
          if (point === null) { sub(parser, intent(':function', symbol)); }
          else {
            const at = list('y', point);
            sub(parser, intent('$f(' + at.names + ')', arg('f', symbol) + '(' + at.body + ')'));
          }
        },
        xmcompose: function (parser, name) {
          const f = parser.GetArgument(name);
          const g = parser.GetArgument(name);
          const applied = (parser.GetNext() === '(');
          const body = arg('f', f) + '\\circ' + arg('g', g);
          sub(parser, apply(parser, 'composed-with:infix($f,$g)', applied ? '(' + body + ')' : body));
        },
        xminv: function (parser, name) {
          const f = parser.GetArgument(name);
          sub(parser, apply(parser, 'inverse:postfix($f)', arg('f', f) + '^{-1}'));
        },
        xmtrans: function (parser, name) {
          const symbol = parser.GetBrackets(name, 'T');
          const m = parser.GetArgument(name);
          sub(parser, intent('transpose:postfix($m)', arg('m', m) + '^{' + symbol + '}'));
        },
        xmvec: function (parser, name) {
          const star = parser.GetStar();
          const v = parser.GetArgument(name);
          sub(parser, intent('vector($v)', star ? '\\vec{' + arg('v', v) + '}' : arg('v', '\\mathbf{' + v + '}')));
        },
        xmunitvec: function (parser, name) {
          const star = parser.GetStar();
          const v = parser.GetArgument(name);
          sub(parser, intent('unit-vector($v)', '\\hat{' + arg('v', star ? v : '\\mathbf{' + v + '}') + '}'));
        },
        xmblank: function (parser, name) {
          const width = parser.GetBrackets(name, '1.5in').trim();
          sub(parser, intent('blank-space', '\\rule[-.2ex]{' + width + '}{.4pt}'));
        }
      });
      Configuration.create('xmintent', {handler: {macro: ['xmintent']}});
      const loadAnswerSupport = function () {
        const core = Array.from(document.scripts).find(function (s) { return (s.src.endsWith('/ximera.js')); });
        if (core) { import(new URL('answer-a11y.js', core.src).href); }
        return (Boolean(core));
      };
      if (!loadAnswerSupport()) { document.addEventListener('DOMContentLoaded', loadAnswerSupport); }
      MathJax.loader.defaultReady();
    }
  },
  options: {
    enableSpeech: false,
    enableBraille: false,
    menuOptions: {settings: {speech: false, braille: false, assistiveMml: true}}
  },
  tex: {
    tags: 'ams',
    packages: {'[+]': ['html', 'xmintent']}
  }
};}}
\catcode`\%=14
\catcode`\#=6
