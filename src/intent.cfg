%% intent.cfg -- MathML intent for Ximera web pages (MathJax 4).
%%
%% The build inserts this file into ximera.cfg, just before \begin{document}.
%% It replaces the MathJax configuration in the head of every page with one
%% that
%%   * loads MathJax's assistive MathML, so a screen reader (NVDA or JAWS with
%%     MathCAT) is given real MathML, and
%%   * defines TeX commands that put the MathML "intent" and "arg" attributes
%%     on that MathML, matching TailorSwiftBot.sty for PDF:
%%       \MathMLintent{<intent>}{<math>}   wraps <math> in an mrow with intent
%%       \MathMLarg{<name>}{<math>}        marks <math> as the argument $<name>
%%       \xmunits[<intent>]{<unit>}        upright unit, intent ":unit" by default
%%       \xmabs{x}                         |x| read as absolute value
%%
%% Rules for editing the JavaScript below. It passes through TeX on its way
%% into the page, which copies it character for character but may turn any
%% space into a line break:
%%   * no spaces inside '...' strings, and nothing after "return" but "(";
%%   * no JavaScript comments, and none of the characters < > &;
%%   * a backslash for MathJax is written \\ as usual in JavaScript.
%% "[tex]/html" and "html" must stay: the answer boxes need them.
\catcode`\%=12
\catcode`\#=12
\Configure{MathJaxConfig}{\detokenize{{
  loader: {load: ['[tex]/html', 'a11y/assistive-mml']},
  tex: {
    tags: 'ams',
    packages: {'[+]': ['html', 'xmintent']},
    macros: {
      xmabs: ['\\MathMLintent{absolute-value($x)}{\\left\\lvert\\MathMLarg{x}{#1}\\right\\rvert}', 1]
    }
  },
  startup: {ready: function () {
    const Configuration = MathJax._.input.tex.Configuration.Configuration;
    const CommandMap = MathJax._.input.tex.TokenMap.CommandMap;
    const TEXCLASS = MathJax._.core.MmlTree.MmlNode.TEXCLASS;
    new CommandMap('xmintent', {
      MathMLintent: function (parser, name) {
        const intent = parser.GetArgument(name).trim();
        const math = parser.ParseArg(name);
        const row = parser.create('node', 'TeXAtom', [math]);
        row.attributes.set('intent', intent);
        parser.Push(row);
      },
      MathMLarg: function (parser, name) {
        const arg = parser.GetArgument(name).trim();
        let node = parser.ParseArg(name);
        if (node.isInferred) { node = parser.create('node', 'TeXAtom', [node]); }
        node.attributes.set('arg', arg);
        parser.Push(node);
      },
      xmunits: function (parser, name) {
        const intent = parser.GetBrackets(name, ':unit').trim();
        const typed = parser.GetArgument(name).trim();
        const text = typed.split('.').join('').split('~').join(' ');
        const node = parser.create('token', 'mi', {mathvariant: 'normal', intent: intent}, text);
        node.texClass = TEXCLASS.ORD;
        parser.Push(node);
      }
    });
    Configuration.create('xmintent', {handler: {macro: ['xmintent']}});
    MathJax.startup.defaultReady();
  }}
};}}
\catcode`\%=14
\catcode`\#=6
