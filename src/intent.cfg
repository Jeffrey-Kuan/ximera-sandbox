%% intent.cfg -- MathML intent for Ximera web pages (MathJax 4).
%%
%% The build inserts this file into ximera.cfg, just before \begin{document}.
%% It replaces the MathJax configuration in the head of every page with one
%% that
%%   * loads MathJax's assistive MathML and switches off MathJax's own
%%     speech and braille ("options"), so a screen reader (NVDA or JAWS with
%%     MathCAT) is given real MathML. With MathJax's speech on, the MathML
%%     is hidden from the screen reader and the intent is never heard. A
%%     reader can switch speech back on in the MathJax menu, and
%%   * defines TeX commands that put the MathML "intent" and "arg" attributes
%%     on that MathML, matching TailorSwiftBot.sty for PDF:
%%       \MathMLintent{<intent>}{<math>}   wraps <math> in an mrow with intent
%%       \MathMLarg{<name>}{<math>}        marks <math> as the argument $<name>
%%       \xmunits[<intent>]{<unit>}        upright unit, intent ":unit" by default
%%       \xmabs{x}                         |x| read as absolute value
%%     (products, composition, inverse and transpose carry a property
%%     such as ":infix" or ":postfix", so that they are read "f composed
%%     with g", "f inverse" also by versions of MathCAT that would
%%     otherwise say "composed with of f comma g", "inverse of f")
%%     and the other commands listed in latex/xmintent.sty, which defines
%%     the same commands for LaTeX. Keep the two files in step.
%%   * loads answer-a11y.js (kept in static/, published next to ximera.js),
%%     which makes \answer boxes usable with a screen reader: the box is met
%%     when reading with the arrow keys, and checking an answer announces
%%     the result. Nothing changes in how \answer is written.
%%
%% Rules for editing the JavaScript below. It passes through TeX on its way
%% into the page, which copies it character for character but may turn any
%% space into a line break:
%%   * no spaces inside '...' strings, and nothing after "return" but "(";
%%   * no JavaScript comments, and none of the characters < > &;
%%   * a backslash for MathJax is written \\ as usual in JavaScript.
%% "[tex]/html" and "html" must stay: the answer boxes need them.
%%
%% The set-up code runs from "loader.ready". Do not move it to
%% "startup.ready": the answer boxes decide that MathJax has loaded by
%% looking for a "startup" entry, and one written here makes them look for
%% their place in the formula before MathJax has drawn it, so that boxes
%% are sometimes missing from the page.
